[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "3.0.0"
description = "AEGIS: repository graph, change mapping and evidence-ranked change impact for Python"
requires-python = ">=3.11"
dependencies = ["networkx>=3.4"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
